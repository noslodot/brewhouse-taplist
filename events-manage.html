<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Events Manager</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#3a0808">
<style>
:root{--bg:#f6f3ee;--card:#fff;--text:#1f1a17;--muted:#6f655e;--border:#ddd5cb;--accent:#8f2418;--accent-text:#fff;--warn:#b45309;--ok:#1d6b3a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#171311;--card:#241e1b;--text:#f1ebe5;--muted:#a79c93;--border:#3b322d;--accent:#c4432f;--accent-text:#fff;--warn:#f59e0b;--ok:#5bc489}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow-x:hidden}
button,input,textarea{font:inherit;color:inherit}
.m{max-width:680px;margin:0 auto;padding:14px 14px 110px;position:relative}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.top h1{font-size:20px;margin:0}
h2{font-size:14px;margin:18px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.r{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.grow b{display:block;font-weight:600;overflow-wrap:anywhere}
.small{font-size:13px;color:var(--muted)}
.help{font-size:13px;color:var(--muted);margin:2px 0 8px}
.btn{border:1px solid var(--border);background:var(--card);border-radius:10px;padding:9px 13px;cursor:pointer;font-size:14px;white-space:nowrap;text-decoration:none;color:var(--text);display:inline-block}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-text);font-weight:600}
.btn.warn{border-color:var(--warn);color:var(--warn)}
.btn[disabled]{opacity:.5;cursor:default}
label.f{display:block;font-size:13px;color:var(--muted);margin:10px 0 3px}
.in{display:block;width:100%;min-width:0;max-width:100%;min-height:46px;padding:10px 11px;border:1px solid var(--border);border-radius:9px;background:var(--bg);font-size:16px;font-family:inherit;-webkit-appearance:none;appearance:none}
textarea.in{min-height:130px;resize:vertical;line-height:1.35}
input[type=date].in,input[type=time].in{height:46px;line-height:1.2}
.three{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr) minmax(0,1fr);gap:8px}
@media (max-width:420px){.three{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.three>div:first-child{grid-column:1 / -1}}
.thumb{width:44px;height:44px;border-radius:7px;object-fit:cover;flex:none;background:var(--border)}
.thumb.big{width:72px;height:72px}
.x{position:absolute;right:4px;top:0;width:48px;height:48px;border:0;background:none;color:var(--muted);font-size:30px;line-height:1;cursor:pointer}
.bar{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--border);display:flex;gap:10px;align-items:center;justify-content:center}
.bar .btn.pri{flex:1;max-width:420px;padding:12px}
.msg{padding:10px 12px;border-radius:10px;border:1px solid var(--warn);color:var(--warn);margin-bottom:10px;font-size:14px}
.msg.ok{border-color:var(--ok);color:var(--ok)}
details.past summary{cursor:pointer;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-size:14px;font-weight:600;margin:18px 0 8px;padding:6px 0}
</style>
</head>
<body>
<div id="root"></div>
<script src="events-lib.js"></script>
<script src="events-manager.js"></script>
</body>
</html>
